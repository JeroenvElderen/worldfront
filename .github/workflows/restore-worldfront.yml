name: Restore WorldFront to a commit

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to restore'
        required: true
        type: string
        default: 'b5900c0035acb434324a14697aaa59f012812dcd'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: worldfront-manual-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate commit and create restoration branch
        id: restore
        env:
          TARGET: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Enter a full 40-character commit SHA"
            exit 1
          fi
          git fetch origin "$TARGET"
          git cat-file -e "$TARGET^{commit}"
          git merge-base --is-ancestor "$TARGET" HEAD || { echo "::error::Target must be an ancestor of current main"; exit 1; }
          BASE="$(git rev-parse HEAD)"
          BRANCH="restore/manual-${TARGET:0:12}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git read-tree --reset -u "$TARGET^{tree}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "::error::Current main already matches the requested snapshot"; exit 1; }
          git commit -m "Restore WorldFront snapshot to ${TARGET}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Open restoration pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.restore.outputs.branch }}
          TARGET: ${{ steps.restore.outputs.target }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "Restore WorldFront to ${TARGET:0:12}" \
            --body "Automated snapshot restoration to commit \`$TARGET\`. Review the diff and CI before merging. No force-push; database and deployment configuration are unchanged."
